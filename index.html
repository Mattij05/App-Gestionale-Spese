<style>
:root{--f:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;--bg:#f3f4f6;--card:#fff;--ink:#111318;--mute:#6b7280;--line:#e5e7eb;--acc:#111318;--onacc:#fff;--track:#e9ebef;--danger:#c8372d;color-scheme:light}
*{box-sizing:border-box}
html{background:var(--bg);min-height:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.4 var(--f);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:background .3s,color .3s}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;transition:transform .12s,background .25s,opacity .25s}
button:active{transform:scale(.95)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg{display:block}
#app{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 130px;transition:filter .25s}
.num,.amt,.tn{font-variant-numeric:tabular-nums}
.hid .amt,.hid .chart,.hid .hide{filter:blur(8px)}
.amt,.chart,.hide{transition:filter .3s}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;min-height:40px}
.who{display:flex;align-items:center;gap:9px;font-size:15px;color:var(--mute);min-width:0}

function load(o){if(!o||typeof o!=='object')return;if(Array.isArray(o.entries))E=o.entries.filter(e=>e&&/^\d{4}-\d{2}-\d{2}$/.test(e.d)&&Number.isFinite(e.a)&&e.a>0&&CATS[e.c]).map(e=>({id:String(e.id||Date.now().toString(36)+Math.random().toString(36).slice(2,6)),d:e.d,a:Math.round(e.a),c:e.c|0,n:String(e.n||'').slice(0,80),t:e.t||0}));if(o.profile)P=Object.assign(P,{n:String(o.profile.n||'').slice(0,24),e:o.profile.e||'🙂'});if(o.pref)PR=Object.assign(PR,o.pref)}

/* ---------- aiuti ---------- */
const NF=new Intl.NumberFormat('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2}),NI=new Intl.NumberFormat('it-IT',{maximumFractionDigits:0});
const sym=()=>SYM[PR.cur]||'€';
const money=c=>NF.format(c/100)+' '+sym();
const compact=c=>{const u=c/100;return u>=1000?(u/1000).toFixed(u%1000?1:0).replace('.',',')+'k':String(Math.round(u))};
const inM=k=>E.filter(e=>e.d.startsWith(k));
const tot=a=>a.reduce((t,e)=>t+e.a,0);
const dimK=k=>new Date(+k.slice(0,4),+k.slice(5),0).getDate();
const addM=(k,n)=>{const d=new Date(+k.slice(0,4),+k.slice(5)-1+n,1);return`${d.getFullYear()}-${pad(d.getMonth()+1)}`};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const dlong=d=>{const[y,m,x]=d.split('-');return cap(new Date(y,m-1,x).toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'long'}))};
const dshort=d=>{const[y,m,x]=d.split('-');return new Date(y,m-1,x).toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'})};
const mhead=k=>`<div class="mnav"><button class="ib" data-n="-1" aria-label="Mese precedente">${svg('l')}</button><button class="mt" data-mp aria-label="Scegli il mese">${MN[+k.slice(5)-1]} <span>${k.slice(0,4)}</span>${svg('dn',16)}</button><button class="ib" data-n="1" aria-label="Mese successivo">${svg('r')}</button></div>`;
const isDark=()=>{const t=resolveTh();return TH[t][8]===1};
const resolveTh=()=>PR.th==='auto'?(matchMedia('(prefers-color-scheme:dark)').matches?'notte':'chiaro'):(TH[PR.th]?PR.th:'chiaro');
const cc=i=>(isDark()?CD:CL)[i];
const cats=a=>{const r=Array(8).fill(0);a.forEach(e=>r[e.c]+=e.a);return r};
function niceMax(v){const u=Math.max(v/100,30),rough=u/3,p=Math.pow(10,Math.floor(Math.log10(rough))),f=rough/p,s=(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;return{step:s*100,max:s*300}}

function loadFont(f){if(!f[3]||document.getElementById('f-'+f[0]))return;const l=document.createElement('link');l.id='f-'+f[0];l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family='+f[3]+'&display=swap';document.head.appendChild(l)}
function applyPref(){const r=document.documentElement,k=resolveTh(),t=TH[k],f=FO.find(x=>x[0]===PR.f)||FO[0];
VR.forEach((v,i)=>r.style.setProperty(v,t[i+1]));r.style.setProperty('--track',t[9]);r.style.setProperty('--danger',t[8]?'#ff7a70':'#c8372d');r.style.colorScheme=t[8]?'dark':'light';r.style.setProperty('--f',f[2]);loadFont(f);

/* ---------- pagine ---------- */
function pHome(){

let delta='';if(pt>0){const p=Math.round((t-pt)/pt*100),mn=MN[+pk.slice(5)-1].toLowerCase();delta=p===0?`Come a ${mn}`:`${p>0?'↑':'↓'} ${Math.abs(p)}% rispetto a ${mn}`;if(k===curYm)delta+=' (stesso periodo)'}

const days=Object.keys(g).sort().reverse().map(d=>{const rows=g[d].sort((a,b)=>(b.t||0)-(a.t||0));return`<div class="dh"><span>${dlong(d)}</span><span class="amt tn">${money(tot(rows))}</span></div><div class="grp">${rows.map(e=>`<button class="row ${e.id===newId?'new':''}" data-ed="${e.id}"><span class="ico" style="background:color-mix(in srgb,${cc(e.c)} 18%,var(--card))">${CATS[e.c][1]}</span><span class="rt"><b>${CATS[e.c][0]}</b>${e.n?`<small>${esc(e.n)}</small>`:''}</span><span class="amt tn">${money(e.a)}</span></button>`).join('')}</div>`}).join('');

<div class="hero"><div class="lab">Speso a ${mn.toLowerCase()}</div><div class="big num amt">${NI.format(Math.floor(t/100))}<small>,${pad(t%100)} ${sym()}</small></div>${delta?`<div class="sub">${delta}</div>`:''}${bud}</div>
${days||`<div class="empty"><b>Nessuna spesa</b>Tocca + per registrare la prima di ${mn.toLowerCase()}.</div>`}`}

function barPath(x,y0,w,h,r){r=Math.min(r,w/2,h);return`M${x},${y0}V${y0-h+r}a${r},${r} 0 0 1 ${r},${-r}h${w-2*r}a${r},${r} 0 0 1 ${r},${r}V${y0}z`}
const VW=320,VH=170,pL=34,pR=6,pT=10,pB=22,PW=VW-pL-pR,PH=VH-pT-pB;
function grid(sc){let s='';for(let i=0;i<=3;i++){const y=pT+PH-PH*i/3;s+=`<line class="gl" x1="${pL}" x2="${VW-pR}" y1="${y}" y2="${y}"/><text x="${pL-6}" y="${y+3}" text-anchor="end">${compact(sc.step*i)}</text>`}return s}
let BD=null,CUM=null,DON=null;
function barsChart(vals,xl,B,lab){const n=vals.length,sc=niceMax(Math.max(...vals,B||0)),bw=PW/n,w=Math.min(bw*.64,22),Y=v=>pT+PH-PH*v/sc.max;
let s=grid(sc);vals.forEach((v,i)=>{if(v>0)s+=`<path class="bg" data-i="${i}" d="${barPath(pL+bw*i+(bw-w)/2,pT+PH,w,PH*v/sc.max,4)}"/>`});
xl.forEach(([i,t])=>s+=`<text x="${pL+bw*i+bw/2}" y="${VH-6}" text-anchor="middle">${t}</text>`);
if(B>0&&B<=sc.max)s+=`<line class="tgt" x1="${pL}" x2="${VW-pR}" y1="${Y(B)}" y2="${Y(B)}"/><text x="${pL+2}" y="${Y(B)-4}">Budget</text>`;
BD={n,vals,lab,bw};
const mx=Math.max(...vals),mi=vals.indexOf(mx);
return{html:`<svg viewBox="0 0 ${VW} ${VH}" data-ch="b" role="img" aria-label="Spese per periodo">${s}</svg>`,def:mx>0?`Picco: ${lab(mi)} · ${money(mx)}`:'Nessuna spesa'}}
function cumChart(k,B){const n=dimK(k),lim=k===curYm?now.getDate():n,daily=Array(n).fill(0);inM(k).forEach(e=>daily[+e.d.slice(8)-1]+=e.a);const cum=[];let a=0;for(let i=0;i<lim;i++){a+=daily[i];cum.push(a)}
const sc=niceMax(Math.max(a,B||0)),X=i=>pL+i*PW/(n-1),Y=v=>pT+PH-PH*v/sc.max;
let s=grid(sc);[1,5,10,15,20,25,30].filter(d=>d<=n).forEach(d=>s+=`<text x="${X(d-1)}" y="${VH-6}" text-anchor="middle">${d}</text>`);
if(B>0)s+=`<path class="tgt" d="M${X(0)},${Y(0)}L${X(n-1)},${Y(B)}"/><text x="${VW-pR}" y="${Y(B)-6}" text-anchor="end">Budget</text>`;
if(cum.length){s+=`<path class="ln" d="${cum.map((v,i)=>(i?'L':'M')+X(i)+','+Y(v)).join('')}"/><line class="cur" id="cl" x1="0" x2="0" y1="${pT}" y2="${pT+PH}" style="display:none"/><circle class="dot" id="cd" cx="${X(cum.length-1)}" cy="${Y(a)}" r="4.5"/>`}
CUM={n,cum,X,Y,k,lim};
return{html:`<svg viewBox="0 0 ${VW} ${VH}" data-ch="c" role="img" aria-label="Spesa cumulata nel mese">${s}</svg>`,def:cum.length?`${money(a)} fino al ${lim}`:'Nessuna spesa'}}
function donut(ct,total){const R=52,C=2*Math.PI*R,segs=ct.map((v,i)=>({v,i})).filter(s=>s.v>0).sort((a,b)=>b.v-a.v),gap=segs.length>1?2.5:0;let off=0,s=`<circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--track)" stroke-width="16"/>`;
segs.forEach(g=>{const len=g.v/total*C;s+=`<circle class="dseg" data-c="${g.i}" cx="70" cy="70" r="${R}" fill="none" stroke="${cc(g.i)}" stroke-width="16" stroke-dasharray="${Math.max(len-gap,.6)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;off+=len});
DON={ct,total};return{svg:`<svg viewBox="0 0 140 140" role="img" aria-label="Spese per categoria">${s}</svg>`,segs}}

function pStats(){
const m=per==='m',k=ym,y=k.slice(0,4),list=m?inM(k):E.filter(e=>e.d.startsWith(y)),t=tot(list),B=PR.bud;
selB=selC=selD=-1;BD=CUM=DON=null;
const nav=m?mhead(k):`<div class="mnav"><button class="ib" data-n="-12" aria-label="Anno precedente">${svg('l')}</button><h2>${y}</h2><button class="ib" data-n="12" aria-label="Anno successivo">${svg('r')}</button></div>`;
let avg;if(m){const d=k===curYm?now.getDate():dimK(k);avg=`${money(Math.round(t/d))} al giorno`}else{const nm=y===String(now.getFullYear())?now.getMonth()+1:12;avg=`${money(Math.round(t/nm))} al mese`}
let c1,c3='';
if(m){const n=dimK(k),v=Array(n).fill(0);inM(k).forEach(e=>v[+e.d.slice(8)-1]+=e.a);c1=barsChart(v,[1,5,10,15,20,25,30].filter(d=>d<=n).map(d=>[d-1,d]),0,i=>dshort(`${k}-${pad(i+1)}`));c3=cumChart(k,B)}
else{const v=Array(12).fill(0);list.forEach(e=>v[+e.d.slice(5,7)-1]+=e.a);c1=barsChart(v,'GFMAMGLASOND'.split('').map((l,i)=>[i,l]),B,i=>`${MN[i]}`)}
const ct=cats(list),dn=t>0?donut(ct,t):null;
const legend=dn?dn.segs.map(g=>`<button class="cr" data-cr="${g.i}"><span class="ico" style="background:color-mix(in srgb,${cc(g.i)} 18%,var(--card))">${CATS[g.i][1]}</span><b>${CATS[g.i][0]}</b><span class="amt tn">${money(g.v)}</span><em>${Math.round(g.v/t*100)}%</em><span class="bar" style="--c:${cc(g.i)}"><i style="width:${g.v/t*100}%;background:${cc(g.i)}"></i></span></button>`).join(''):'';
return`<div class="seg"><button class="${m?'on':''}" data-p="m">Mese</button><button class="${m?'':'on'}" data-p="y">Anno</button></div>${nav}
<div class="hero" style="margin-bottom:18px"><div class="lab">Totale</div><div class="big num amt">${NI.format(Math.floor(t/100))}<small>,${pad(t%100)} ${sym()}</small></div><div class="sub amt">${t>0?avg:'Nessuna spesa in questo periodo'}</div></div>
<div class="card"><div class="ch"><h3>Andamento</h3><span class="amt" id="rb">${c1.def}</span></div><div class="chart bars">${c1.html}</div></div>
<div class="card"><div class="ch"><h3>Categorie</h3></div>${dn?`<div class="cat"><div class="dwrap chart">${dn.svg}<div class="dctr"><small id="dl">Totale</small><b class="amt" id="dv">${money(t)}</b></div></div><div class="note" style="margin:0;flex:1">Tocca una categoria per evidenziarla.</div></div><div class="leg">${legend}</div>`:'<div class="empty" style="padding:20px 0">Nessuna spesa da mostrare</div>'}</div>
${m?`<div class="card"><div class="ch"><h3>Ritmo</h3><span class="amt" id="rc">${c3.def}</span></div><div class="chart">${c3.html}</div><p class="note">Spesa accumulata giorno per giorno${B>0?'; la linea tratteggiata è il budget':''}.</p></div>`:''}`}

function pProfile(){
const n=E.length,y=String(now.getFullYear()),ye=E.filter(e=>e.d.startsWith(y)),nm=now.getMonth()+1,byM={};E.forEach(e=>byM[e.d.slice(0,7)]=(byM[e.d.slice(0,7)]||0)+e.a);

${emoOpen?`<div class="emo">${EMO.map(e=>`<button class="${e===P.e?'on':''}" data-e="${e}">${e}</button>`).join('')}</div>`:''}
<div class="st">${cell('Quest\'anno',money(tot(ye)),ye.length+' spese')}${cell('Media al mese',money(Math.round(tot(ye)/nm)),'da gennaio')}${cell('Mese più caro',top?money(top[1]):'–',top?MN[+top[0].slice(5)-1]+' '+top[0].slice(0,4):'')}${cell('Categoria top',n?CATS[ti][1]+' '+CATS[ti][0]:'–',n?money(ct[ti]):'')}${cell('Spese registrate',String(n),'in totale')}${cell('Spesa media',n?money(Math.round(tot(E)/n)):'–','')}</div>

`}

/* ---------- render ---------- */
function render(){
const a=document.getElementById('app'),F=fx;fx='';
const top=tab==='home'?`<div class="top"><div class="who"><span class="av">${esc(P.e)}</span>${P.n?`<span>Ciao, <b>${esc(P.n)}</b></span>`:''}</div><button class="ib" id="eye" aria-label="${PR.hide?'Mostra importi':'Nascondi importi'}">${svg(PR.hide?'eyeoff':'eye')}</button></div>`:'';
const body=tab==='home'?pHome():tab==='stats'?pStats():tab==='profilo'?pProfile():pSet();
a.className=(PR.hide?'hid ':'')+(F?'fx-'+F:'');
a.innerHTML=`${top}<div class="pg">${body}</div>`;
drawBar(F==='t');
if(tab==='home'){let f=document.getElementById('fab');if(!f){f=document.createElement('button');f.id='fab';f.className='fab';f.setAttribute('aria-label','Nuova spesa');f.innerHTML=svg('plus',26,2.2);f.onclick=()=>openSheet();document.body.appendChild(f)}}else{const f=document.getElementById('fab');if(f)f.remove()}
bind(a);newId=null}
function drawBar(pop){let b=document.getElementById('bar');if(!b){b=document.createElement('nav');b.id='bar';b.className='tabs';document.body.appendChild(b)}
const T=[['home','home','Home'],['stats','stats','Statistiche'],['profilo','user','Profilo'],['imp','sets','Impostazioni']];
b.innerHTML=`<div>${T.map(([k,ic,l])=>`<button class="${tab===k?'on':''} ${pop&&tab===k?'pop':''}" data-t="${k}" aria-label="${l}"><span>${svg(ic,24,tab===k?2.1:1.8)}</span></button>`).join('')}</div>`;
b.querySelectorAll('[data-t]').forEach(x=>x.onclick=()=>{if(tab===x.dataset.t)return;tab=x.dataset.t;fx='t';emoOpen=false;render();window.scrollTo(0,0)})}
function step(n){const k=addM(ym,n);if(+k.slice(0,4)<2000||+k.slice(0,4)>2100)return;ym=k;fx=n>0?'r':'l';render()}

function bind(a){const g=s=>a.querySelectorAll(s);
g('[data-n]').forEach(b=>b.onclick=()=>step(+b.dataset.n));
g('[data-mp]').forEach(b=>b.onclick=openMonths);
g('[data-ed]').forEach(b=>b.onclick=()=>openSheet(b.dataset.ed));
const eye=a.querySelector('#eye');if(eye)eye.onclick=()=>{PR.hide=!PR.hide;save();a.classList.toggle('hid',PR.hide);eye.innerHTML=svg(PR.hide?'eyeoff':'eye');eye.setAttribute('aria-label',PR.hide?'Mostra importi':'Nascondi importi')};
g('[data-p]').forEach(b=>b.onclick=()=>{per=b.dataset.p;fx='t';render()});
/* grafici */
const sb=a.querySelector('svg[data-ch="b"]');if(sb)scrub(sb,e=>{const i=Math.max(0,Math.min(BD.n-1,Math.floor((e.x-pL)/BD.bw)));selB=i;sb.querySelectorAll('.bg').forEach(p=>p.style.opacity=+p.dataset.i===i?1:.3);const v=BD.vals[i];a.querySelector('#rb').textContent=`${BD.lab(i)} · ${money(v)}`});
const sc=a.querySelector('svg[data-ch="c"]');if(sc&&CUM&&CUM.cum.length)scrub(sc,e=>{const i=Math.max(0,Math.min(CUM.lim-1,Math.round((e.x-pL)/(PW/(CUM.n-1)))));const x=CUM.X(i),cl=sc.querySelector('#cl'),cd=sc.querySelector('#cd');cl.style.display='';cl.setAttribute('x1',x);cl.setAttribute('x2',x);cd.setAttribute('cx',x);cd.setAttribute('cy',CUM.Y(CUM.cum[i]));a.querySelector('#rc').textContent=`${money(CUM.cum[i])} fino al ${i+1}`});
const pick=i=>{selC=selC===i?-1:i;a.querySelectorAll('.dseg').forEach(s=>s.classList.toggle('dim',selC>=0&&+s.dataset.c!==selC));a.querySelectorAll('.cr').forEach(s=>s.classList.toggle('dim',selC>=0&&+s.dataset.cr!==selC));const dl=a.querySelector('#dl'),dv=a.querySelector('#dv');if(dl){dl.textContent=selC>=0?CATS[selC][0]:'Totale';dv.textContent=money(selC>=0?DON.ct[selC]:DON.total)}};
g('[data-cr]').forEach(b=>b.onclick=()=>pick(+b.dataset.cr));g('.dseg').forEach(s=>s.onclick=()=>pick(+s.dataset.c));
/* profilo */
const pn=a.querySelector('#pn');if(pn)pn.oninput=()=>{P.n=pn.value.trim();save()};
g('[data-emo]').forEach(b=>b.onclick=()=>{emoOpen=!emoOpen;render()});
g('[data-e]').forEach(b=>b.onclick=()=>{P.e=b.dataset.e;emoOpen=false;save();render()});
/* impostazioni */
g('details[data-s]').forEach(d=>d.ontoggle=()=>{open[d.dataset.s]=d.open});
g('[data-th]').forEach(b=>b.onclick=()=>{PR.th=b.dataset.th;save();applyPref();render()});
g('[data-f]').forEach(b=>b.onclick=()=>{PR.f=b.dataset.f;save();applyPref();render()});
g('[data-cur]').forEach(b=>b.onclick=()=>{PR.cur=b.dataset.cur;save();render()});
const sbt=a.querySelector('#sb');if(sbt)sbt.onclick=()=>{const v=a.querySelector('#bu').value.trim();if(!v){PR.bud=0;save();render();return toast('Budget tolto')}const c=parseAmt(v);if(!c)return toast('Inserisci un importo valido');PR.bud=c;save();render();toast('Budget salvato')};

function scrub(svgEl,fn){const h=e=>{const r=svgEl.getBoundingClientRect();fn({x:(e.clientX-r.left)/r.width*VW})};svgEl.addEventListener('pointerdown',h);svgEl.addEventListener('pointermove',e=>{if(e.pointerType==='mouse'||e.buttons||e.pointerType==='touch')h(e)})}

/* ---------- foglio nuova/modifica spesa ---------- */
function parseAmt(s){s=String(s).replace(/\s/g,'').replace(/[€$£]/g,'');if(/,/.test(s))s=s.replace(/\./g,'').replace(',','.');if(!/^\d*\.?\d+$|^\d+\.?$/.test(s))return 0;const c=Math.round(parseFloat(s)*100);return c>0&&c<1e11?c:0}
function openSheet(id){
const e=id&&E.find(x=>x.id===id);let cat=e?e.c:(PR.lc||0);
const d0=e?e.d:(ym===curYm?todayIso:ym+'-01');
const el=document.createElement('div');el.className='ov';
el.innerHTML=`<div class="sh" role="dialog" aria-label="${e?'Modifica spesa':'Nuova spesa'}"><header><h3>${e?'Modifica spesa':'Nuova spesa'}</h3><button class="ib" data-cl aria-label="Chiudi">${svg('x',22)}</button></header>
<div class="amtin"><label class="lbl" for="sa" style="text-align:center">Importo (${sym()})</label><input type="text" id="sa" inputmode="decimal" placeholder="0,00" autocomplete="off" value="${e?(e.a/100).toFixed(2).replace('.',','):''}" aria-label="Importo"></div>
<div class="cg">${CATS.map((c,i)=>`<button data-k="${i}" class="${i===cat?'on':''}"><b>${c[1]}</b>${c[0]}</button>`).join('')}</div>
<div class="fg"><label class="lbl">Giorno</label><input type="date" id="sd" value="${d0}"></div>
<div class="fg"><label class="lbl">Nota (facoltativa)</label><input type="text" id="sn" maxlength="80" placeholder="es. Pizza con gli amici" value="${esc(e?e.n:'')}"></div>
<p class="err" id="se"></p><button class="go" id="ss">${e?'Salva modifiche':'Aggiungi spesa'}</button>${e?'<button class="txtbtn" id="sx">Elimina spesa</button>':''}</div>`;
document.body.appendChild(el);document.body.style.overflow='hidden';
const q=s=>el.querySelector(s),close=()=>{document.body.style.overflow='';el.classList.add('out');setTimeout(()=>el.remove(),200)};
q('[data-cl]').onclick=close;el.onclick=ev=>{if(ev.target===el)close()};
el.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{cat=+b.dataset.k;el.querySelectorAll('[data-k]').forEach(x=>x.classList.toggle('on',x===b))});
q('#ss').onclick=()=>{const a=parseAmt(q('#sa').value),d=q('#sd').value,n=q('#sn').value.trim(),er=q('#se');
if(!a){er.textContent='Inserisci un importo valido';q('#sa').focus();return}
if(!/^\d{4}-\d{2}-\d{2}$/.test(d)){er.textContent='Scegli un giorno';return}
let it=e;if(it){it.a=a;it.c=cat;it.d=d;it.n=n}else{it={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),d,a,c:cat,n,t:Date.now()};E.push(it)}
PR.lc=cat;ym=d.slice(0,7);tab='home';newId=it.id;fx=e?'':'a';save();close();render();toast(e?'Modifica salvata':'Spesa aggiunta')};
const sx=q('#sx');if(sx)sx.onclick=()=>{const rm=E.find(x=>x.id===id);E=E.filter(x=>x.id!==id);save();close();render();toast('Spesa eliminata',()=>{E.push(rm);save();render()})};
q('#sa').addEventListener('keydown',ev=>{if(ev.key==='Enter')q('#ss').click()});
if(!e)setTimeout(()=>q('#sa').focus(),60)}

/* ---------- scelta del mese ---------- */
function openMonths(){let y=+ym.slice(0,4);const el=document.createElement('div');el.className='ov';document.body.appendChild(el);document.body.style.overflow='hidden';
const close=()=>{document.body.style.overflow='';el.classList.add('out');setTimeout(()=>el.remove(),200)};
const draw=()=>{const has=new Set(E.map(e=>e.d.slice(0,7)));el.innerHTML=`<div class="sh" role="dialog" aria-label="Scegli il mese"><header><h3>Scegli il mese</h3><button class="ib" data-cl aria-label="Chiudi">${svg('x',22)}</button></header><div class="yn"><button class="ib" data-y="-1" aria-label="Anno precedente">${svg('l')}</button><b>${y}</b><button class="ib" data-y="1" aria-label="Anno successivo">${svg('r')}</button></div><div class="mg">${MN.map((n,i)=>{const k=`${y}-${pad(i+1)}`;return`<button data-m="${k}" class="${k===ym?'on':''} ${has.has(k)?'has':''}">${n.slice(0,3)}</button>`}).join('')}</div><button class="go ghost" data-today style="margin-top:0">Vai a questo mese</button></div>`;
el.querySelector('[data-cl]').onclick=close;el.querySelectorAll('[data-y]').forEach(b=>b.onclick=()=>{const n=y+ +b.dataset.y;if(n>=2000&&n<=2100){y=n;draw()}});
const go=k=>{if(k!==ym){fx=k>ym?'r':'l';ym=k;render()}close()};
el.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>go(b.dataset.m));el.querySelector('[data-today]').onclick=()=>go(curYm)};
el.onclick=ev=>{if(ev.target===el)close()};draw()}

/* ---------- avvisi, file ---------- */
let tt=null; 
function toast(msg,undo){const old=document.querySelector('.toast');if(old)old.remove();clearTimeout(tt);const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.innerHTML=`<span>${esc(msg)}</span>${undo?'<button>Annulla</button>':''}`;document.body.appendChild(t);if(undo)t.querySelector('button').onclick=()=>{t.remove();undo()};tt=setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),250)},undo?5000:2400)}
async function saveFile(name,text,type){const bom=type.includes('csv')?'﻿':'',blob=new Blob([bom+text],{type});
try{const f=new File([blob],name,{type});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}catch(e){if(e&&e.name==='AbortError')return}
const u=URL.createObjectURL(blob),l=document.createElement('a');l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('File pronto')}
function exportCsv(){const rows=[...E].sort((a,b)=>a.d.localeCompare(b.d)).map(e=>[e.d,(e.a/100).toFixed(2).replace('.',','),CATS[e.c][0],'"'+e.n.replace(/"/g,'""')+'"'].join(';'));saveFile('le-mie-spese.csv',['data;importo;categoria;nota',...rows].join('\n'),'text/csv')}
function restore(ev){const f=ev.target.files[0];ev.target.value='';if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!Array.isArray(o.entries))throw 0;if(!confirm(`Sostituire i dati attuali con il backup (${o.entries.length} spese)?`))return;E=[];load(o);save();applyPref();ym=curYm;render();toast('Backup ripristinato')}catch(e){toast('Il file non è un backup valido')}};r.readAsText(f)}

{let x0=0,y0=0;const A=document.getElementById('app');A.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});A.addEventListener('touchend',e=>{if(tab!=='home')return;const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;if(Math.abs(dx)>80&&Math.abs(dy)<40&&!/INPUT/.test(e.target.tagName))step(dx<0?1:-1)},{passive:true})}
