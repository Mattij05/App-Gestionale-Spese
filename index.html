<style>
:root{--f:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;--bg:#f3f4f6;--card:#fff;--ink:#111318;--mute:#6b7280;--line:#e5e7eb;--acc:#111318;--onacc:#fff;--track:#e9ebef;--danger:#c8372d;color-scheme:light}
*{box-sizing:border-box}
html{background:var(--bg);min-height:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.4 var(--f);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:background .3s,color .3s}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;transition:transform .12s,background .25s,opacity .25s}
button:active{transform:scale(.95)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
svg{display:block}
#app{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 130px;transition:filter .25s}
.num,.amt,.tn{font-variant-numeric:tabular-nums}
.hid .amt,.hid .chart,.hid .hide{filter:blur(8px)}
.amt,.chart,.hide{transition:filter .3s}
.shield #app{filter:blur(16px)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;min-height:40px}
.who{display:flex;align-items:center;gap:9px;font-size:15px;color:var(--mute);min-width:0}
.who b{font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.av{width:30px;height:30px;border-radius:50%;background:var(--track);display:grid;place-items:center;font-size:16px;flex:none}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.ib:disabled{opacity:.25}
.mnav{display:flex;align-items:center;justify-content:space-between;margin:6px 0 0}
.mnav h2{margin:0;font-size:19px;font-weight:600}.mnav h2 span{color:var(--mute);font-weight:500}
.hero{margin:16px 0 26px}
.lab{font-size:13px;color:var(--mute)}
.big{font-size:54px;font-weight:700;letter-spacing:-.03em;line-height:1.05;margin-top:2px}
.big small{font-size:24px;font-weight:600;color:var(--mute);letter-spacing:0;margin-left:2px}
.sub{font-size:14px;color:var(--mute);margin-top:6px}
.bud{margin-top:18px}
.bar{height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--acc)}
.bar.over i{background:var(--danger)}
.brow{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--mute);margin-top:8px}
.brow .bad{color:var(--danger);font-weight:600}

/* list */
.dh{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin:18px 4px 7px}
.grp{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:0 14px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.ico{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:18px;flex:none}
.rt{flex:1;min-width:0}.rt b{display:block;font-weight:600;font-size:16px}.rt small{display:block;color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-weight:600}
.empty{text-align:center;color:var(--mute);padding:38px 12px;font-size:15px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.fab{position:fixed;right:max(20px,calc(50% - 220px));bottom:calc(86px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--acc);color:var(--onacc);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.22);z-index:5}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 84%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.tabs>div{display:flex;width:100%;max-width:440px}
.tabs button{flex:1;height:48px;display:grid;place-items:center;color:var(--mute)}
.tabs button span{width:58px;height:34px;border-radius:17px;display:grid;place-items:center;transition:background .25s}
.tabs button.on{color:var(--ink)}
.tabs button.on span{background:var(--track)}
.tabs button.pop svg{animation:pop .5s cubic-bezier(.34,1.56,.64,1)}

/* cards, forms */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.ch{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.ch h3{margin:0;font-size:16px;font-weight:600}.ch span{font-size:13px;color:var(--mute);text-align:right}
.seg{display:flex;background:var(--track);border-radius:12px;padding:3px;margin:12px 0 4px}
.seg button{flex:1;padding:8px 0;border-radius:9px;font-weight:600;font-size:14px;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.lbl{display:block;font-size:13px;color:var(--mute);margin:0 0 6px}
input[type=text],input[type=date],input[type=search]{width:100%;min-width:0;max-width:100%;min-height:46px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);display:block;-webkit-appearance:none;appearance:none;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
.go{width:100%;min-height:50px;border-radius:14px;background:var(--acc);color:var(--onacc);font-weight:600;font-size:16px}
.go.ghost{background:none;border:1px solid var(--line);color:var(--ink);margin-top:8px}
.go.warn{background:none;border:1px solid var(--danger);color:var(--danger);margin-top:8px}
.txtbtn{display:block;margin:12px auto 0;color:var(--danger);font-weight:600;padding:8px 14px}
.note{font-size:13px;color:var(--mute);margin:10px 0 0}

/* charts */
.chart svg{width:100%;height:auto;touch-action:pan-y;overflow:visible}
.chart text{fill:var(--mute);font-size:10px;font-family:var(--f)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .bg{fill:var(--acc);transition:opacity .2s}
.chart .tgt{stroke:var(--mute);stroke-width:1.5;stroke-dasharray:4 4;fill:none}
.chart .ln{stroke:var(--acc);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}

/* ---------- stato ---------- */
const now=new Date(),curYm=`${now.getFullYear()}-${pad(now.getMonth()+1)}`,todayIso=`${curYm}-${pad(now.getDate())}`;
const LS='spese-v1';

function load(o){if(!o||typeof o!=='object')return;if(Array.isArray(o.entries))E=o.entries.filter(e=>e&&/^\d{4}-\d{2}-\d{2}$/.test(e.d)&&Number.isFinite(e.a)&&e.a>0&&CATS[e.c]).map(e=>({id:String(e.id||Date.now().toString(36)+Math.random().toString(36).slice(2,6)),d:e.d,a:Math.round(e.a),c:e.c|0,n:String(e.n||'').slice(0,80),t:e.t||0}));if(o.profile)P=Object.assign(P,{n:String(o.profile.n||'').slice(0,24),e:o.profile.e||'🙂'});if(o.pref)PR=Object.assign(PR,o.pref)}

/* ---------- aiuti ---------- */
const NF=new Intl.NumberFormat('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2}),NI=new Intl.NumberFormat('it-IT',{maximumFractionDigits:0});

/* ---------- pagine ---------- */
function pHome(){
const k=ym,list=inM(k),t=tot(list),pk=addM(k,-1),pl=k===curYm?inM(pk).filter(e=>+e.d.slice(8)<=now.getDate()):inM(pk),pt=tot(pl),B=PR.bud;

${days||`<div class="empty"><b>Nessuna spesa</b>Tocca + per registrare la prima di ${mn.toLowerCase()}.</div>`}`}

function barPath(x,y0,w,h,r){r=Math.min(r,w/2,h);return`M${x},${y0}V${y0-h+r}a${r},${r} 0 0 1 ${r},${-r}h${w-2*r}a${r},${r} 0 0 1 ${r},${r}V${y0}z`}
const VW=320,VH=170,pL=34,pR=6,pT=10,pB=22,PW=VW-pL-pR,PH=VH-pT-pB;

function cumChart(k,B){const n=dimK(k),lim=k===curYm?now.getDate():n,daily=Array(n).fill(0);inM(k).forEach(e=>daily[+e.d.slice(8)-1]+=e.a);const cum=[];let a=0;for(let i=0;i<lim;i++){a+=daily[i];cum.push(a)}
